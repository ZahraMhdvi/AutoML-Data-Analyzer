  <path d="M19 11.5 C19.5 15.3 20.7 16.5 24.5 17 C20.7 17.5 19.5 18.7 19 22.5 C18.5 18.7 17.3 17.5 13.5 17 C17.3 16.5 18.5 15.3 19 11.5 Z" fill="url(#g)"/>
